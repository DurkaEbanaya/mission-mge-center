[workspace]
members = ["core"]
resolver = "2"

[package]
name = "mc-graph-widget"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "GTK4/libadwaita time-series graph widget extracted from Mission Center"
repository = "https://gitlab.com/mission-center-devs/graph-widget"
readme = "README.md"

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_5"]

[dependencies.gtk]
package = "gtk4"
version = "0.11"
features = ["v4_14"]

[dependencies.mc-graph-core]
path = "core"
